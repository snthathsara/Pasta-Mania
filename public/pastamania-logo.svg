<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pastaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31837" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#pastaRedGrad)" stroke="#FFFFFF" stroke-width="3.5" filter="url(#shadow)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 2"/>

  <!-- Stylized Pasta Fork with twirling Spaghetti -->
  <g transform="translate(60, 48)">
    <!-- Fork Head & Prongs -->
    <path d="M -12 -22 L -12 -8 C -12 -3 -8 0 -3 2 L -3 24 L 3 24 L 3 2 C 8 0 12 -3 12 -8 L 12 -22 L 9 -22 L 9 -10 C 9 -8 7 -8 7 -10 L 7 -22 L 4 -22 L 4 -10 C 4 -8 2 -8 2 -10 L 2 -22 L -1 -22 L -1 -10 C -1 -8 -3 -8 -3 -10 L -3 -22 L -6 -22 L -6 -10 C -6 -8 -8 -8 -8 -10 L -8 -22 Z" fill="#FFFFFF"/>
    <!-- Spaghetti twirl around fork -->
    <path d="M -18 -6 Q 0 4 18 -6 Q 22 2 12 7 Q 0 11 -14 5 Q -22 14 -4 14 Q 8 14 16 11" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Curved brand text / Banner -->
  <rect x="18" y="78" width="84" height="20" rx="10" fill="#111111" stroke="#FFFFFF" stroke-width="1"/>
  <text x="60" y="92.5" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">PASTAMANIA</text>
  <text x="60" y="106" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">COLOMBO</text>
</svg>
